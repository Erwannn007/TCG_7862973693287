<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Pixel Gacha</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pixel Gacha">
  <meta name="theme-color" content="#1a1114">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/pixelify-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jacquarda-bastarda-9.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Camp : l'accueil, un feu de camp dans le donjon -->
    <section id="scr-camp" class="screen">
      <canvas id="camp-canvas" class="px scene-bg"></canvas>
      <header class="topbar">
        <h1 class="title">Pixel Gacha</h1>
        <div class="tb-right">
          <button id="go-replay" class="icon-btn" aria-label="Rejouer une étape"></button>
          <button id="btn-daily" class="icon-btn hidden" aria-label="Bonus du jour"></button>
          <div class="gold-pill"><span class="coin"></span><b class="gold-amt">0</b></div>
          <button id="btn-options" class="icon-btn" aria-label="Options"></button>
        </div>
      </header>
      <div class="camp-actions">
        <button id="go-team" class="btn side"><span class="ico" data-ico="team"></span><span>Équipe</span></button>
        <button id="go-fight" class="btn gold big"><span class="ico" data-ico="fight"></span><span><b>Combattre</b><small id="fight-info"></small></span></button>
        <button id="go-summon" class="btn side"><span>Invoquer</span><span class="ico" data-ico="summon"></span></button>
      </div>
    </section>

    <!-- Équipe : liste à gauche, fiche détaillée à droite -->
    <section id="scr-team" class="screen menu hidden">
      <header class="topbar">
        <button class="icon-btn back" aria-label="Retour"></button>
        <h1 class="title">Équipe</h1>
        <div class="tb-right"><div class="gold-pill"><span class="coin"></span><b class="gold-amt">0</b></div></div>
      </header>
      <div class="split">
        <div id="team-left" class="panel wood"></div>
        <div id="team-detail" class="panel parch"></div>
      </div>
    </section>

    <!-- Invoquer : l'autel à gauche, les taux et boutons à droite -->
    <section id="scr-summon" class="screen menu hidden">
      <header class="topbar">
        <button class="icon-btn back" aria-label="Retour"></button>
        <h1 class="title">Invocation</h1>
        <div class="tb-right"><div class="gold-pill"><span class="coin"></span><b class="gold-amt">0</b></div></div>
      </header>
      <div class="split">
        <div id="summon-altar" class="panel stone"></div>
        <div id="summon-info" class="panel parch"></div>
      </div>
    </section>

    <!-- Combat -->
    <section id="scr-battle" class="screen hidden">
      <canvas id="b-canvas" class="px"></canvas>
      <div id="b-top">
        <div id="b-stage" class="ribbon"></div>
        <div id="b-queue" class="panel wood thin"></div>
        <div class="b-tools">
          <button id="b-auto" class="medal" aria-label="Auto"></button>
          <button id="b-speed" class="medal" aria-label="Vitesse"></button>
          <button id="b-flee" class="medal" aria-label="Fuir"></button>
        </div>
      </div>
      <div id="b-log" class="panel parch thin"></div>
      <div id="b-arc"></div>
    </section>

    <!-- Révélation des cartes -->
    <div id="reveal" class="overlay hidden">
      <div id="reveal-grid"></div>
      <button id="reveal-ok" class="btn gold">OK</button>
    </div>

    <!-- Fenêtre générique -->
    <div id="modal" class="overlay hidden">
      <div id="modal-box" class="panel parch"></div>
    </div>
  </div>

  <!-- En portrait : demander de tourner le téléphone -->
  <div id="rotate">
    <canvas id="rotate-canvas" class="px"></canvas>
    <p>Tourne ton téléphone<br>pour jouer</p>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
