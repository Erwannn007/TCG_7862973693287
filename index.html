<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Pixel Gacha</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pixel Gacha">
  <meta name="theme-color" content="#cfc9bf">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Tout le jeu se joue dans la console « Pixel Boy ». -->
  <div class="gb">
    <div class="gb-top">
      <button id="power" class="gb-power" aria-label="Interrupteur"><i></i><span id="power-label">ON</span></button>
      <span class="gb-top-brand">PIXEL GACHA</span>
    </div>

    <div class="gb-bezel">
      <div class="gb-bezel-label"><span class="gb-led"></span><i></i><span>PIXEL MATRIX</span><i></i></div>

      <div id="lcd" class="lcd">
        <header id="hud">
          <span id="hud-title">COMBAT</span>
          <span class="hud-gold"><span id="coin"></span><span id="gold">0</span></span>
        </header>

        <section id="v-team" class="view hidden"></section>
        <section id="v-home" class="view hidden"></section>
        <section id="v-gacha" class="view hidden"></section>

        <section id="v-battle" class="hidden">
          <canvas id="b-canvas" class="px"></canvas>
          <div id="b-log" class="win dialog"></div>
        </section>

        <nav id="tabs">
          <button data-tab="team"><span class="ico"></span><b>EQUIPE</b></button>
          <button data-tab="home"><span class="ico"></span><b>COMBAT</b></button>
          <button data-tab="gacha"><span class="ico"></span><b>INVOQUER</b></button>
        </nav>

        <div id="reveal" class="layer hidden">
          <div id="reveal-grid"></div>
          <button id="reveal-ok" class="pbtn gold">OK</button>
        </div>

        <div id="modal" class="layer hidden">
          <div id="modal-body" class="win"></div>
        </div>
      </div>
    </div>

    <div class="gb-logo">Pixel<b>BOY</b></div>

    <div class="gb-controls">
      <div class="well dpad-well">
        <div class="dpad">
          <button class="up" data-dir="up" aria-label="Haut"></button>
          <button class="left" data-dir="left" aria-label="Gauche"></button>
          <span class="mid"></span>
          <button class="right" data-dir="right" aria-label="Droite"></button>
          <button class="down" data-dir="down" aria-label="Bas"></button>
        </div>
      </div>
      <div class="ab">
        <div class="well ab-well">
          <span class="cap b"><button id="key-b" aria-label="B">B</button></span>
          <span class="cap a"><button id="key-a" aria-label="A">A</button></span>
        </div>
        <div class="ab-labels"><span id="label-b">RETOUR</span><span id="label-a">VALIDER</span></div>
      </div>
    </div>

    <div class="gb-pills">
      <span></span>
      <div class="pill"><button id="key-select" aria-label="Select"></button><span id="label-select">SELECT</span></div>
      <div class="pill"><button id="key-start" aria-label="Start"></button><span id="label-start">START</span></div>
      <div class="gb-speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
