<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Pixel Gacha</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pixel Gacha">
  <meta name="theme-color" content="#1a1114">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/pixelify-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jacquarda-bastarda-9.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Trois pièces côte à côte, on passe de l'une à l'autre en balayant :
         Équipe (gauche) · Camp (centre) · Invocation (droite). -->
    <section id="scr-camp" class="screen">
      <canvas id="camp-canvas" class="px scene-bg"></canvas>
      <header class="topbar">
        <h1 class="title">Pixel Gacha</h1>
        <div class="tb-right">
          <button id="go-replay" class="icon-btn" aria-label="Rejouer une étape"></button>
          <button id="btn-daily" class="icon-btn hidden" aria-label="Bonus du jour"></button>
          <div class="gold-pill"><span class="coin"></span><b class="gold-amt">0</b></div>
          <button id="btn-options" class="icon-btn" aria-label="Options"></button>
        </div>
      </header>
      <div id="door-sign"><span class="ribbon" id="fight-info"></span><span class="hint">Touche la porte</span></div>
    </section>

    <section id="scr-team" class="screen hidden">
      <canvas id="team-canvas" class="px scene-bg"></canvas>
      <header class="topbar">
        <h1 class="title">Équipe</h1>
        <div class="tb-right"><div class="gold-pill"><span class="coin"></span><b class="gold-amt">0</b></div></div>
      </header>
      <div class="split">
        <div id="team-left" class="panel wood"></div>
        <div id="team-detail" class="panel parch"></div>
      </div>
    </section>

    <section id="scr-summon" class="screen hidden">
      <canvas id="summon-canvas" class="px scene-bg"></canvas>
      <header class="topbar">
        <h1 class="title">Invocation</h1>
        <div class="tb-right"><div class="gold-pill"><span class="coin"></span><b class="gold-amt">0</b></div></div>
      </header>
      <div id="s-info"></div>
      <div id="s-veil"></div>
      <div id="s-menu" class="signs hidden"></div>
    </section>

    <!-- Repères de navigation : flèches sur les bords et points en bas -->
    <div id="nav-hints">
      <button class="edge left" data-go="-1"><i></i><span></span></button>
      <button class="edge right" data-go="1"><span></span><i></i></button>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
    <canvas id="wind" class="px"></canvas>

    <!-- Combat -->
    <section id="scr-battle" class="screen hidden">
      <canvas id="b-canvas" class="px"></canvas>
      <div id="b-top">
        <div id="b-stage" class="ribbon"></div>
        <div id="b-queue" class="panel wood thin"></div>
        <div class="b-tools">
          <button id="b-auto" class="tool" aria-label="Auto"></button>
          <button id="b-speed" class="tool" aria-label="Vitesse"></button>
          <button id="b-flee" class="tool" aria-label="Fuir"></button>
        </div>
      </div>
      <div id="b-log" class="panel parch thin"></div>
      <div id="b-menu" class="signs hidden"></div>
    </section>

    <!-- Révélation des cartes -->
    <div id="reveal" class="overlay hidden">
      <div id="reveal-grid"></div>
      <button id="reveal-ok" class="btn gold">OK</button>
    </div>

    <div id="fader"></div>

    <!-- Fenêtre générique -->
    <div id="modal" class="overlay hidden">
      <div id="modal-box" class="panel parch"></div>
    </div>
  </div>

  <!-- En portrait : demander de tourner le téléphone -->
  <div id="rotate">
    <canvas id="rotate-canvas" class="px"></canvas>
    <p>Tourne ton téléphone<br>pour jouer</p>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
