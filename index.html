<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Pixel Gacha</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pixel Gacha">
  <meta name="theme-color" content="#1f1830">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="top">
    <div class="brand">PIXEL GACHA</div>
    <div class="money"><span id="coin"></span><span id="gold">0</span></div>
  </header>

  <main>
    <section id="scr-combat" class="screen"></section>
    <section id="scr-gacha" class="screen hidden"></section>
    <section id="scr-collection" class="screen hidden"></section>
    <section id="scr-team" class="screen hidden"></section>
  </main>

  <nav id="tabs">
    <button data-scr="combat">Combat</button>
    <button data-scr="gacha">Invoquer</button>
    <button data-scr="collection">Collection</button>
    <button data-scr="team">Équipe</button>
  </nav>

  <div id="battle" class="overlay hidden">
    <canvas id="b-canvas" class="px"></canvas>
    <div id="b-log" class="panel"></div>
    <div class="b-actions">
      <button id="b-attack" class="btn big" disabled>Attaque</button>
      <button id="b-skill" class="btn big" disabled>Compétence</button>
    </div>
    <div class="b-tools">
      <button id="b-auto" class="btn">Auto</button>
      <button id="b-speed" class="btn">×1</button>
      <button id="b-flee" class="btn ghost">Fuir</button>
    </div>
  </div>

  <div id="reveal" class="overlay hidden">
    <div id="reveal-grid"></div>
    <button id="reveal-ok" class="btn big">OK</button>
  </div>

  <div id="modal" class="overlay hidden">
    <div id="modal-body" class="panel"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
