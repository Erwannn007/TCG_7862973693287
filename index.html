<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Pixel Gacha</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pixel Gacha">
  <meta name="theme-color" content="#1f1830">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="top">
    <div class="brand">PIXEL GACHA</div>
    <div class="money"><span id="coin"></span><span id="gold">0</span></div>
  </header>

  <main>
    <section id="scr-combat" class="screen"></section>
    <section id="scr-gacha" class="screen hidden"></section>
    <section id="scr-collection" class="screen hidden"></section>
    <section id="scr-team" class="screen hidden"></section>
  </main>

  <nav id="tabs">
    <button data-scr="combat">Combat</button>
    <button data-scr="gacha">Invoquer</button>
    <button data-scr="collection">Collection</button>
    <button data-scr="team">Équipe</button>
  </nav>

  <!-- Combat : habillé comme une console portable -->
  <div id="battle" class="hidden">
    <div class="gb">
      <div class="gb-top">
        <button id="b-flee" class="gb-power" aria-label="Fuir le combat"><i></i>OFF · FUIR</button>
      </div>
      <div class="gb-bezel">
        <div class="gb-bezel-label"><span class="gb-led"></span><i></i><span>PIXEL MATRIX · TOUR PAR TOUR</span><i></i></div>
        <div class="gb-screen">
          <canvas id="b-canvas" class="px"></canvas>
          <div id="b-log" class="gb-dialog"></div>
        </div>
      </div>
      <div class="gb-logo">Pixel<b>BOY</b></div>

      <div class="gb-controls">
        <div class="dpad">
          <button class="up" data-d="-1" aria-label="Cible précédente"></button>
          <button class="left" data-d="-1" aria-label="Cible précédente"></button>
          <span class="mid"></span>
          <button class="right" data-d="1" aria-label="Cible suivante"></button>
          <button class="down" data-d="1" aria-label="Cible suivante"></button>
        </div>
        <div class="ab">
          <div class="ab-key b"><button id="b-skill" disabled>B</button><span id="b-skill-name">Compétence</span></div>
          <div class="ab-key a"><button id="b-attack" disabled>A</button><span>Attaque</span></div>
        </div>
      </div>

      <div class="gb-pills">
        <span></span>
        <div class="pill"><button id="b-auto" aria-label="Combat automatique"></button><span id="b-auto-label">SELECT · AUTO</span></div>
        <div class="pill"><button id="b-speed" aria-label="Vitesse"></button><span id="b-speed-label">START · ×1</span></div>
        <div class="gb-speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
  </div>

  <div id="reveal" class="overlay hidden">
    <div id="reveal-grid"></div>
    <button id="reveal-ok" class="btn big">OK</button>
  </div>

  <div id="modal" class="overlay hidden">
    <div id="modal-body" class="panel"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
